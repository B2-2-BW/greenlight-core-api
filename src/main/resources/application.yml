spring.application.name: greenlight-core-api
spring.profiles.active: local

server:
  port: 18080
  url: ${SERVER_URL:http://localhost:18080}

spring:
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_DEV_HOST:127.0.0.1}
      port: ${REDIS_DEV_PORT:6379}
      password: ${REDIS_PASSWORD}
      cluster:
        max-redirects: 5
        nodes: ${REDIS_CLUSTER_NODES:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: 3s
      timeout: 5s
      lettuce:
        pool:
          time-between-eviction-runs: 300000
  web:
    error:
      include-message: always

management:
  server:
    port: 18090
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "info, health, prometheus"
#        include: "*"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    info:
      access: unrestricted
    health:
      access: unrestricted
    prometheus:
      access: read_only

logging:
  config: classpath:logback/logback-spring.xml
  loki:
    url: ${LOKI_URL:}
#  pattern:
#    level: %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
#  include-application-name: false

redis:
  key-prefix: ${REDIS_KEY_PREFIX}
  connection-type: ${REDIS_CONNECTION_TYPE:standalone}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    expiration: ${JWT_EXPIRATION}



springdoc:
  swagger-ui:
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
    defaultModelsExpandDepth: -1
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match:
    - /**

---
spring.config.activate.on-profile: local

---
spring.config.activate.on-profile: dev

---
spring.config.activate.on-profile: live
management:
  endpoints:
    web:
      base-path: ${GREENLIGHT_ACTUATOR_PATH}